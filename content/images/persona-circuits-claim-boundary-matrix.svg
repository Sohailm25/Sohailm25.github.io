<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Persona-circuits claim boundary, March 2026</text>
  <text x="60" y="105" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#4b5563">Green = partial support, amber = mixed / below threshold, red = negative under current operationalization, gray = exploratory weak-negative/null.</text>

  <g transform="translate(60,150)">
    <rect x="0" y="0" width="220" height="250" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="20" y="40" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#14532d">H1</text>
    <text x="20" y="78" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#14532d">Partial support</text>
    <text x="20" y="112" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#14532d">Concentration exists,</text>
    <text x="20" y="136" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#14532d">but reconstruction caveats</text>
    <text x="20" y="160" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#14532d">still limit the claim.</text>
    <text x="20" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#166534">Sycophancy gini: 0.5771</text>
    <text x="20" y="228" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#166534">Machiavellian gini: 0.6476</text>
  </g>

  <g transform="translate(300,150)">
    <rect x="0" y="0" width="220" height="250" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="20" y="40" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#9a3412">H2</text>
    <text x="20" y="78" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Strict fail</text>
    <text x="20" y="112" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9a3412">Best necessity read stays</text>
    <text x="20" y="136" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9a3412">below the 0.80 bar.</text>
    <text x="20" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a3412">Best zero ablation: 0.5627</text>
    <text x="20" y="228" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9a3412">Best resample: 0.2585</text>
  </g>

  <g transform="translate(540,150)">
    <rect x="0" y="0" width="220" height="250" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="20" y="40" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#991b1b">H3</text>
    <text x="20" y="78" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">Negative</text>
    <text x="20" y="112" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#991b1b">Full-complement sufficiency</text>
    <text x="20" y="136" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#991b1b">collapsed coherence and</text>
    <text x="20" y="160" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#991b1b">capability.</text>
    <text x="20" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#991b1b">Dose 0.25: 0.2857</text>
    <text x="20" y="228" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#991b1b">Dose 0.50: 0.3571</text>
  </g>

  <g transform="translate(780,150)">
    <rect x="0" y="0" width="220" height="250" rx="18" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <text x="20" y="40" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#374151">H4</text>
    <text x="20" y="78" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#374151">Weak-negative</text>
    <text x="20" y="112" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">Expected overlap direction,</text>
    <text x="20" y="136" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">but below threshold.</text>
    <text x="20" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">Early Jaccard: 0.1696</text>
    <text x="20" y="228" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">Late Jaccard: 0.1236</text>
  </g>

  <g transform="translate(1020,150)">
    <rect x="0" y="0" width="200" height="250" rx="18" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <text x="20" y="40" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#374151">H5</text>
    <text x="20" y="78" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#374151">Exploratory null</text>
    <text x="20" y="112" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">No FDR-significant router</text>
    <text x="20" y="136" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">candidates in the tested set.</text>
    <text x="20" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">n tested: 62</text>
    <text x="20" y="228" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">min q: 0.0465</text>
  </g>

  <g transform="translate(60,450)">
    <rect x="0" y="0" width="1160" height="220" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="24" y="42" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">How to read this matrix</text>
    <text x="24" y="78" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#374151">The project is not a null. H1 survives in narrowed form: we do see non-flat concentration structure.</text>
    <text x="24" y="108" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#374151">What broke is the stronger bridge from steering to clean causal circuit claims. H2 and H3 do not clear claim-grade bars.</text>
    <text x="24" y="138" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#374151">H4 and H5 stay in exploratory territory. That is still publishable, but it is a mixed / negative result story, not a clean discovery story.</text>
    <text x="24" y="184" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7280">Source memo: 20260314-project-synthesis-memo-v1.md plus the stage3 / stage4 / stage5 packets cited in the post appendix.</text>
  </g>
</svg>
