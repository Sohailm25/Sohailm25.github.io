<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3A4F2A">

  <title>Dermatology Dosing</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">

  <link rel="stylesheet" href="../styles.css">
</head>
<body class="maha-page maha-drug-page">

  <header class="maha-drug-header maha-header">
    <div class="maha-broadsheet-rule"></div>
    <a href="../" class="maha-crumb">← Search</a>
    <span id="maha-review-badge" class="maha-badge maha-badge--amber">AUTO-EXTRACTED</span>
    <p id="maha-drug-eyebrow" class="maha-eyebrow"></p>
    <h1 id="maha-drug-title" class="maha-title"></h1>
    <p id="maha-drug-subtitle" class="maha-drug-subtitle"></p>
  </header>

  <main class="maha-main">

    <div id="maha-disclaimer" class="maha-disclaimer">
      <p class="maha-disclaimer-title">Reference only.</p>
      <p class="maha-disclaimer-body">
        Always verify against the current FDA prescribing label before administering.
        This tool is auto-extracted from team-authored flowcharts and has not been
        clinically reviewed.
      </p>
    </div>

    <section id="maha-trace" class="maha-trace" aria-label="Dosing"></section>

    <section id="maha-supply" class="maha-supply" hidden>
      <p class="maha-label">Supply</p>
      <ul id="maha-supply-list" class="maha-supply-list"></ul>
    </section>

    <p id="maha-source" class="maha-source-attribution"></p>

    <a id="maha-report" class="maha-report-issue" href="#">Report an issue</a>

  </main>

  <script src="../app.js" type="module"></script>
</body>
</html>
