<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="description" content="{{ SITEDESCRIPTION|default('') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/material-darker.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <script>document.addEventListener('DOMContentLoaded', function(){hljs.highlightAll();});</script>
</head>
<body{% block body_class %}{% endblock %}>
  <header>
    <div class="container">
      <div class="header-inner">
        <div class="header-content">
          <div class="header-left">
            <a href="{{ SITEURL }}/" class="logo-link">
              <div class="logo"><span>{{ SITENAME }}</span></div>
            </a>
          </div>
          <nav aria-label="Main navigation">
            <ul>
              <li><a href="{{ SITEURL }}/"{% block nav_home %}{% endblock %}>Home</a></li>
              <li><a href="{{ SITEURL }}/posts/"{% block nav_posts %}{% endblock %}>Posts</a></li>
              <li><a href="{{ SITEURL }}/pages/about/"{% block nav_about %}{% endblock %}>About</a></li>
            </ul>
          </nav>
          <div class="social-icons">
            {% for name, url in SOCIAL %}
            {% if name == 'email' %}
            <a class="social-icon" href="{{ url }}" title="Email" aria-label="Email">
              <svg viewBox="0 0 24 24"><path d="M3 3h18a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm17 4.238l-7.928 7.1L4 7.216V19h16V7.238zM4.511 5l7.55 6.662L19.502 5H4.511z"/></svg>
            </a>
            {% elif name == 'github' %}
            <a class="social-icon" href="{{ url }}" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
              <svg viewBox="0 0 24 24"><path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.1 3.29 9.42 7.86 10.96.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.36-1.3-1.72-1.3-1.72-1.06-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.73 1.27 3.4.97.11-.75.41-1.27.74-1.56-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .98-.31 3.2 1.18a11.1 11.1 0 0 1 2.92-.39c.99 0 1.99.13 2.92.39 2.22-1.49 3.2-1.18 3.2-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.41-5.27 5.7.42.36.79 1.09.79 2.2 0 1.59-.01 2.87-.01 3.26 0 .31.21.68.8.56C20.71 21.44 24 17.12 24 12.02 24 5.74 18.27.5 12 .5z"/></svg>
            </a>
            {% elif name == 'twitter' %}
            <a class="social-icon" href="{{ url }}" target="_blank" rel="noopener" title="X (Twitter)" aria-label="X (Twitter)">
              <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>
            {% elif name == 'linkedin' %}
            <a class="social-icon" href="{{ url }}" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn">
              <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            </a>
            {% endif %}
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="main-container">
      <main id="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% if CLOUDFLARE_ANALYTICS_TOKEN %}
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "{{ CLOUDFLARE_ANALYTICS_TOKEN }}"}'></script>
  {% endif %}
</body>
</html>
