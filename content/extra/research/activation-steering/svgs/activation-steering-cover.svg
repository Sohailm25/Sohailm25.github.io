<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1008" width="1920" height="1008">
  <rect width="1920" height="1008" fill="#FFFFFF"/>
  
  <!-- Central residual stream axis -->
  <line x1="960" y1="80" x2="960" y2="920" stroke="#1F2430" stroke-width="4" opacity="0.15"/>
  <text x="960" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">residual stream</text>
  <text x="960" y="960" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">output</text>
  
  <!-- Layer depth markers -->
  <g font-family="system-ui, sans-serif" font-size="10" fill="#6B7280" opacity="0.5">
    <text x="935" y="140" text-anchor="end">L1</text>
    <line x1="940" y1="136" x2="960" y2="136" stroke="#6B7280" stroke-width="1.5" opacity="0.3"/>
    <text x="935" y="300" text-anchor="end">L8</text>
    <line x1="940" y1="296" x2="960" y2="296" stroke="#6B7280" stroke-width="1.5" opacity="0.3"/>
    <text x="935" y="500" text-anchor="end">L16</text>
    <line x1="940" y1="496" x2="960" y2="496" stroke="#6B7280" stroke-width="1.5" opacity="0.3"/>
    <text x="935" y="700" text-anchor="end">L24</text>
    <line x1="940" y1="696" x2="960" y2="696" stroke="#6B7280" stroke-width="1.5" opacity="0.3"/>
    <text x="935" y="860" text-anchor="end">L32</text>
    <line x1="940" y1="856" x2="960" y2="856" stroke="#6B7280" stroke-width="1.5" opacity="0.3"/>
  </g>
  
  <!-- Steering injection point (arrow into stream) -->
  <g transform="translate(960, 496)">
    <line x1="-200" y1="0" x2="-20" y2="0" stroke="#E9B44C" stroke-width="2.5" opacity="0.6"/>
    <polygon points="-20,-6 -20,6 -8,0" fill="#E9B44C" opacity="0.6"/>
    <text x="-210" y="-8" font-family="system-ui, sans-serif" font-size="12" fill="#E9B44C" text-anchor="end" opacity="0.7">steering vector d</text>
    <text x="-210" y="8" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" text-anchor="end" opacity="0.5">layer l through N</text>
  </g>
  
  <!-- LEFT BRANCH: Effective steering (Qwen-like, small scale) -->
  <g transform="translate(300, 120)">
    <text x="100" y="-10" font-family="system-ui, sans-serif" font-size="14" fill="#1F2430" text-anchor="middle" font-weight="600" opacity="0.7">effective</text>
    <text x="100" y="8" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Qwen 3B-7B</text>
    
    <!-- Clean residual stream with steering applied -->
    <line x1="100" y1="30" x2="100" y2="780" stroke="#1E5AA8" stroke-width="2.5" opacity="0.3"/>
    
    <!-- Steering effect: clean deflection -->
    <path d="M100,376 Q130,400 140,430 Q145,460 140,490 Q130,520 100,540" fill="none" stroke="#1FA7A0" stroke-width="2.5" opacity="0.5"/>
    
    <!-- Output marker: coherent refusal -->
    <circle cx="100" cy="780" r="8" fill="none" stroke="#1FA7A0" stroke-width="2.5" opacity="0.5"/>
    <text x="100" y="810" font-family="system-ui, sans-serif" font-size="11" fill="#1FA7A0" text-anchor="middle" opacity="0.6">100% coherent</text>
    
    <!-- Multiplier indicator -->
    <g transform="translate(160, 420)">
      <rect x="0" y="0" width="60" height="24" rx="4" fill="none" stroke="#6B7280" stroke-width="1.5" opacity="0.3"/>
      <text x="30" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">15×</text>
    </g>
  </g>
  
  <!-- CENTER-RIGHT BRANCH: Degraded steering (Qwen 32B) -->
  <g transform="translate(1200, 120)">
    <text x="100" y="-10" font-family="system-ui, sans-serif" font-size="14" fill="#1F2430" text-anchor="middle" font-weight="600" opacity="0.7">degraded</text>
    <text x="100" y="8" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Qwen 14B-32B</text>
    
    <!-- Residual stream with partial deflection -->
    <line x1="100" y1="30" x2="100" y2="780" stroke="#1E5AA8" stroke-width="2.5" opacity="0.3"/>
    
    <!-- Steering effect: partial, some recovery -->
    <path d="M100,376 Q115,400 120,430 Q122,460 118,490 Q110,510 105,530 Q102,550 100,570" fill="none" stroke="#E9B44C" stroke-width="2.5" opacity="0.5"/>
    
    <!-- Competing directions (noise) -->
    <g stroke="#6B7280" stroke-width="1.5" opacity="0.15">
      <line x1="100" y1="376" x2="85" y2="400"/>
      <line x1="100" y1="410" x2="115" y2="435"/>
      <line x1="100" y1="450" x2="90" y2="470"/>
    </g>
    
    <!-- Output marker: mixed -->
    <circle cx="100" cy="780" r="8" fill="none" stroke="#E9B44C" stroke-width="2.5" opacity="0.5"/>
    <text x="100" y="810" font-family="system-ui, sans-serif" font-size="11" fill="#E9B44C" text-anchor="middle" opacity="0.6">77% coherent</text>
    
    <!-- Narrower multiplier window -->
    <g transform="translate(160, 420)">
      <rect x="0" y="0" width="60" height="24" rx="4" fill="none" stroke="#E9B44C" stroke-width="1.5" opacity="0.3"/>
      <text x="30" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#E9B44C" text-anchor="middle">15×</text>
      <text x="30" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle" opacity="0.5">narrow window</text>
    </g>
  </g>
  
  <!-- RIGHT BRANCH: Unstable / failed (Mistral) -->
  <g transform="translate(1550, 120)">
    <text x="100" y="-10" font-family="system-ui, sans-serif" font-size="14" fill="#1F2430" text-anchor="middle" font-weight="600" opacity="0.7">unstable</text>
    <text x="100" y="8" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Mistral 7B</text>
    
    <!-- Residual stream: garbled -->
    <line x1="100" y1="30" x2="100" y2="780" stroke="#1E5AA8" stroke-width="2.5" opacity="0.3"/>
    
    <!-- Steering effect: chaotic, no coherent deflection -->
    <g stroke="#6B7280" stroke-width="1.5" opacity="0.3">
      <path d="M100,376 Q130,385 110,410 Q85,430 120,450 Q140,465 95,490 Q75,510 115,530 Q135,545 90,570 Q80,590 110,610" fill="none"/>
    </g>
    
    <!-- Output marker: garbled -->
    <circle cx="100" cy="780" r="8" fill="none" stroke="#6B7280" stroke-width="2.5" opacity="0.3" stroke-dasharray="4,3"/>
    <text x="100" y="810" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" opacity="0.5">0% coherent</text>
    
    <!-- Multiplier indicator: n/a -->
    <g transform="translate(160, 420)">
      <rect x="0" y="0" width="60" height="24" rx="4" fill="none" stroke="#6B7280" stroke-width="1.5" opacity="0.2" stroke-dasharray="4,3"/>
      <text x="30" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle" opacity="0.4">any</text>
    </g>
  </g>
  
  <!-- Scale axis at bottom -->
  <g transform="translate(300, 930)">
    <line x1="0" y1="0" x2="1350" y2="0" stroke="#6B7280" stroke-width="1.5" opacity="0.2"/>
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" opacity="0.5">2B</text>
    <text x="400" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" opacity="0.5">7B</text>
    <text x="800" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" opacity="0.5">14B</text>
    <text x="1100" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280" opacity="0.5">32B</text>
    <text x="675" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">model scale</text>
  </g>
</svg>